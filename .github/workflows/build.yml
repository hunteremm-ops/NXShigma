name: Build NXShigma

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Nintendo Switch app
      
       run: docker run --rm -v "$PWD/NXShigma_Graphic_Starter:/work" -w /work devkitpro/devkita64:latest bash -lc 'make'



      - uses: actions/upload-artifact@v4
        with:
          name: NXShigma-build
          path: NXShigma_Graphic_Starter/**/*.nro
          if-no-files-found: error

