name: Build NXShigma

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Nintendo Switch app
        working-directory: NXShigma_Graphic_Starter
        run: docker run --rm -v "$PWD:/work" -w /work devkitpro/devkita64:latest bash -lc 'dkp-pacman -S --needed --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_ttf && make'


      - uses: actions/upload-artifact@v4
        with:
          name: NXShigma-build
          path: NXShigma_Graphic_Starter/**/*.nro
          if-no-files-found: error

